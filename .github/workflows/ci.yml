name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Types TypeScript
        run: npm run typecheck
      - name: Tests des règles métier
        run: npm test
      - name: Build de production
        run: npm run build
